# hurricaneTerm 发布工作流
#
# 触发：推送 v* 标签（如 v0.3.0）→ 自动构建三平台安装包并创建 Release。
#       也可在 Actions 页面手动触发（workflow_dispatch）。
#
# 产物：
#   Linux  : .deb / .rpm / .AppImage
#   Windows: .msi / .exe (NSIS)
#   macOS  : .dmg / .app（仅 Apple Silicon；Intel x64 构建已移除）
#
# 说明：前端 dist/ 由 tauri.conf.json 的 beforeBuildCommand 自动生成
#       （npm run prepare-dist 从 node_modules 拷贝 xterm 等静态资源）。

name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

# Explicit bash uses -e -o pipefail on every runner, including Windows.
# A failed native command must stop its step before a later success masks it.
defaults:
  run:
    shell: bash

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # ---- macOS：仅 Apple Silicon ----
          - platform: macos-latest        # Apple Silicon
            args: '--target aarch64-apple-darwin'
            label: macOS-arm64
          # ---- Linux ----
          - platform: ubuntu-22.04
            args: '--bundles deb,rpm,appimage'
            label: Linux-x64
          # ---- Windows ----
          - platform: windows-latest
            args: ''
            label: Windows-x64

    runs-on: ${{ matrix.platform }}
    name: build (${{ matrix.label }})
    # job 级探测：步骤级 if 用它决定走「签名」还是「不签名」分支
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin' || '' }}

      - name: Rust 构建缓存
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: 安装 Linux 系统依赖
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libxdo-dev \
            patchelf \
            rpm \
            build-essential curl wget file

      - name: 降低 macOS dmg 打包抖动（Spotlight 索引会让 hdiutil 偶发 EBUSY）
        if: startsWith(matrix.platform, 'macos')
        run: sudo mdutil -a -i off || true

      - name: 安装前端依赖
        run: npm ci

      - name: 前端 UI 回归测试
        run: npm run test:ui

      - name: SFTP 文件管理回归测试
        run: npm run test:sftp

      - name: 现代控件与终端输出生命周期回归
        run: |
          npm run test:controls
          npm run test:terminal

      - name: 终端透明度、工具浮窗、窗口按钮和图标回归
        run: |
          npm run test:appearance
          npm run test:layout
          npm run test:mac-controls
          npm run test:icons

      - name: 快速连接与连续标题栏回归
        run: |
          npm run test:quick-connect
          npm run test:header

      - name: 标签内分屏与 Gist 配置同步回归
        run: |
          npm run test:workspace
          npm run test:gist
          npm run test:reconnect
          npm run test:ai
          npm run test:ai-agent
          npm run test:ai-ops
          npm run test:ai-context
          npm run test:ai-memory
          npm run test:ai-memory-integration
          npm run test:text-input
          npm run test:connections
          npm run test:connection-feedback

      - name: 原生协议、AI 记忆与凭据回归
        run: |
          npm run prepare-dist
          cargo test --manifest-path src-tauri/Cargo.toml gist_sync::tests
          cargo test --manifest-path src-tauri/Cargo.toml ai::tests
          cargo test --manifest-path src-tauri/Cargo.toml credentials::tests
          cargo test --manifest-path src-tauri/Cargo.toml memory::tests
          cargo test --manifest-path src-tauri/Cargo.toml mac_text_input::tests
          cargo test --manifest-path src-tauri/Cargo.toml agent_exec::tests
          cargo test --manifest-path src-tauri/Cargo.toml connection_error::tests
          cargo test --manifest-path src-tauri/Cargo.toml ssh_live::session_tests
          cargo test --manifest-path src-tauri/Cargo.toml jump::tests

      - name: macOS 原生 PTY 关闭与 UTF-8 回归
        if: startsWith(matrix.platform, 'macos')
        run: node scripts/native-terminal-test.mjs --online

      # 注意：APPLE_* 只能「整组注入」或「整组不注入」。
      # 空字符串会被 tauri-bundler 视为「需要签名」而去 security import 一张空证书，
      # 直接报 `failed to import keychain certificate`（v0.7.0 的 macOS 失败即此）。
      # 是否配置由 job 级 env 探测，未配置时走下面这个完全不注入 APPLE_* 的步骤。
      - name: 构建并发布（未配置 Apple 签名）
        if: env.APPLE_CERTIFICATE == ''
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'hurricaneTerm ${{ github.ref_name }}'
          releaseBody: |
            hurricaneTerm ${{ github.ref_name }} — 跨平台终端（SSH / Telnet / 串口 / TCP + SFTP）

            附件为各平台安装包：
            - Linux：`.deb`（Debian/Ubuntu/Kali）、`.rpm`、`.AppImage`
            - Windows：`.msi`、NSIS `.exe`
            - macOS：`.dmg`（Apple Silicon arm64，未签名：首次打开前执行 `xattr -cr /Applications/hurricaneTerm.app`）

            原创实现（Apache-2.0）。
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: 构建并发布（已配置 Apple 签名 + 公证）
        if: env.APPLE_CERTIFICATE != ''
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'hurricaneTerm ${{ github.ref_name }}'
          releaseBody: |
            hurricaneTerm ${{ github.ref_name }} — 跨平台终端（SSH / Telnet / 串口 / TCP + SFTP）

            附件为各平台安装包：
            - Linux：`.deb`（Debian/Ubuntu/Kali）、`.rpm`、`.AppImage`
            - Windows：`.msi`、NSIS `.exe`
            - macOS：`.dmg`（Apple Silicon arm64，已签名 + 公证）

            原创实现（Apache-2.0）。
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
