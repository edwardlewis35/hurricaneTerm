<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>hurricaneTerm</title>
  <link rel="icon" type="image/png" href="huricano-icon.png" />
  <link rel="stylesheet" href="vendor/xterm.css" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="sftp.css" />
  <link rel="stylesheet" href="transfer-queue.css" />
  <link rel="stylesheet" href="modem.css" />
  <link rel="stylesheet" href="terminal-appearance.css" />
  <link rel="stylesheet" href="mac-window-controls.css" />
  <link rel="stylesheet" href="quick-connect.css" />
  <link rel="stylesheet" href="gist-sync.css" />
  <link rel="stylesheet" href="workspace.css" />
  <link rel="stylesheet" href="ai.css" />
  <link rel="stylesheet" href="ai-memory.css" />
</head>
<body>
  <!-- 无边框窗口：标签栏内嵌标题栏（Tabby 形态） -->
  <header id="titlebar">
    <div class="tb-drag tb-drag-l"></div>
    <div id="mac-lights">
      <span class="ml ml-close" data-act="close" title="关闭"></span>
      <span class="ml ml-min" data-act="minimize" title="最小化"></span>
      <span class="ml ml-max" data-act="maximize" title="最大化"></span>
    </div>
    <div id="tabbar"></div>
    <div class="tb-drag tb-drag-fill"></div>
    <div id="tb-actions"></div>
    <div id="tb-winctl"></div>
  </header>

  <nav id="actbar" aria-label="终端工具栏"></nav>

  <div id="workspace">
    <div id="dock-backdrop" hidden></div>
    <aside id="dock" hidden role="dialog" aria-modal="true" aria-labelledby="dock-title" tabindex="-1">
      <header class="dock-window-head">
        <b id="dock-title">会话</b>
        <button type="button" id="dock-close" aria-label="关闭工具窗口" title="关闭 (Esc)"></button>
      </header>
      <div id="dock-body"></div>
    </aside>
    <main id="main-area">
      <div id="home" hidden></div>
      <div id="settings" hidden></div>
      <div id="search-float" hidden>
        <input id="search-input" placeholder="查找…" spellcheck="false" />
        <span id="search-count" class="sf-count"></span>
        <span id="search-prev" class="sf-btn" title="上一个 (Shift+F3)"></span>
        <span id="search-next" class="sf-btn" title="下一个 (F3)"></span>
        <span id="search-close" class="sf-btn" title="关闭 (Esc)"></span>
      </div>
      <div id="groups" data-dir="">
        <section class="group" data-g="0"><div class="term-host"></div></section>
        <div id="gutter" hidden></div>
        <section class="group" data-g="1" hidden><div class="term-host"></div></section>
      </div>
    </main>
    <aside id="ai-panel" hidden aria-label="AI 助手"></aside>
    <section id="sftp-panel" hidden aria-label="SFTP 文件管理"></section>
  </div>

  <footer id="statusbar">
    <span id="st-mode" class="chip click" title="本地/远程模式">远程模式</span>
    <span id="st-sync" class="chip click" title="同步输入：所有会话同时接收键盘输入">同步输入：关</span>
    <span class="spacer"></span>
    <span id="st-size" class="chip mono" title="活动终端行列">80 × 24</span>
    <span id="st-enc" class="chip mono">UTF-8</span>
    <span id="st-eol" class="chip mono">LF</span>
    <span id="st-zoom" class="chip mono click" title="点击重置字号">13 px</span>
    <span id="st-theme" class="chip click" title="点击切换主题">dige-black</span>
    <span id="st-clock" class="chip mono"></span>
    <span class="chip dim">0.10.2</span>
  </footer>

  <div id="palette" hidden>
    <div class="palette-box">
      <input id="palette-input" placeholder="输入命令…（↑↓ 选择，Enter 执行，Esc 关闭）" spellcheck="false" />
      <div id="palette-list"></div>
    </div>
  </div>

  <div id="toasts"></div>

  <script src="vendor/xterm.js"></script>
  <script src="vendor/addon-fit.js"></script>
  <script src="vendor/addon-search.js"></script>
  <script src="vendor/addon-web-links.js"></script>
  <script src="core.js"></script>
  <script src="icons.js"></script>
  <script src="appearance.js"></script>
  <script src="common-controls.js"></script>
  <script src="transfer-queue.js"></script>
  <script src="modem.js"></script>
  <script src="sftp.js"></script>
  <script src="titlebar.js"></script>
  <script src="tabbar.js"></script>
  <script src="actbar.js"></script>
  <script src="profiles.js"></script>
  <script src="home.js"></script>
  <script src="settings.js"></script>
  <script src="gist-sync.js"></script>
  <script src="term.js"></script>
  <script src="ai-memory.js"></script>
  <script src="ai-memory-flush.js"></script>
  <script src="ai-context.js"></script>
  <script src="ai-agent.js"></script>
  <script src="ai.js"></script>
  <script src="ui.js"></script>
</body>
</html>
