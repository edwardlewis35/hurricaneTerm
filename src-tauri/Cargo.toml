[package]
name = "hurricane-term"
version = "0.3.0"
description = "hurricaneTerm — Tauri 2 terminal (WindTerm analysis -> clean-room reimplementation)"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
portable-pty = "0.8"
uuid = { version = "1", features = ["v4"] }

[profile.release]
opt-level = 2
lto = false
codegen-units = 16
strip = true
