[package]
name = "hurricane-term"
version = "0.7.11"
description = "hurricaneTerm — cross-platform Tauri 2 terminal (SSH/Telnet/serial/TCP + SFTP)"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
portable-pty = "0.8"
uuid = { version = "1", features = ["v4"] }
russh = { version = "0.64", default-features = false, features = ["ring", "rsa", "flate2"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "sync", "time", "net", "fs"] }
futures-util = "0.3"
dirs = "6"
russh-sftp = "3"
socket2 = { version = "0.6", features = ["all"] }
base64 = "0.22"
bytes = "1"

[profile.release]
opt-level = 2
lto = false
codegen-units = 16
strip = true

[target.'cfg(unix)'.dependencies]
termios = "0.3"
libc = "0.2"
